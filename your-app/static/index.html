<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>無駄遣いチェッカー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💸 無駄遣いチェッカー</h1>
        
        <div class="card">
            <label>使っていい金額（予算）:</label>
            <input type="number" id="budget-input" value="10000">
        </div>

        <div class="card summary">
            <div>使った合計: <span id="total-amount">0</span> 円</div>
            <div>残り予算: <span id="remaining-amount">0</span> 円</div>
        </div>

        <div class="card form">
            <input type="text" id="title-input" placeholder="買っちゃったもの">
            <input type="number" id="amount-input" placeholder="金額">
            <button onclick="addExpense()">記録</button>
        </div>

        <h2>履歴</h2>
        <ul id="expense-list"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
